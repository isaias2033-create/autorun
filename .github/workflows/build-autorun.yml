# Compila o Autorun (runtime AMD64, com FEX) do jeito do build.sh e entrega
# horizon-wine/build-autorun/autorun-NNN.zip como artefato da execucao.
# Vai em .github/workflows/build-autorun.yml do seu fork.
name: Build Autorun

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      # O runner vem com ~14 GB livres; Wine, FEX e Mesa precisam de mais.
      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ferramentas do build
        run: sudo apt-get update && sudo apt-get install -y bison flex xz-utils

      # Toolchain e boot payloads ficam guardados entre execucoes: se uma
      # passar do limite de 6 h, a proxima comeca de onde ela parou.
      - name: Restaurar cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            horizon-wine/toolchains
            horizon-wine/build-wine-amd64-pe
            horizon-wine/build-switch-amd64
          key: autorun-build-${{ github.run_id }}
          restore-keys: autorun-build-

      - name: Compilar (sh build.sh)
        run: sh build.sh --jobs "$(nproc)"

      - name: Salvar cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            horizon-wine/toolchains
            horizon-wine/build-wine-amd64-pe
            horizon-wine/build-switch-amd64
          key: autorun-build-${{ github.run_id }}

      - name: Enviar o zip
        uses: actions/upload-artifact@v4
        with:
          name: autorun-amd64
          path: horizon-wine/build-autorun/*.zip
          if-no-files-found: error
